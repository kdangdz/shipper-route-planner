<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Shipper Route Planner - Visualizer</title>
    <!-- Thư viện CSS Bản đồ Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- Import Google Font Inter cho giao diện hiện đại -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        height: 100vh;
        background-color: #f8fafc;
        color: #1e293b;
        overflow: hidden;
      }

      /* Sidebar Glassmorphism & Clean Card Design */
      #sidebar {
        width: 360px;
        padding: 24px;
        background: #ffffff;
        border-right: 1px solid #e2e8f0;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.03);
        z-index: 1000;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Scrollbar tinh tế */
      #sidebar::-webkit-scrollbar {
        width: 6px;
      }
      #sidebar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }

      #map {
        flex: 1;
        height: 100%;
        z-index: 1;
      }

      /* Typography & Headers */
      h2 {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.5px;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
        color: #334155;
        margin-top: 8px;
      }
      p {
        font-size: 13px;
        color: #64748b;
      }

      /* Form Controls: Inputs & Selects */
      label {
        font-size: 12px;
        font-weight: 600;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input[type="number"],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        color: #1e293b;
        background-color: #f8fafc;
        transition: all 0.2s ease;
        outline: none;
      }
      input[type="number"]:focus,
      select:focus {
        border-color: #3b82f6;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      /* Custom Modern Buttons */
      .btn {
        width: 100%;
        padding: 11px 16px;
        background: #22c55e;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s ease;
        box-shadow: 0 2px 4px rgba(34, 197, 94, 0.15);
      }
      .btn:hover {
        background: #16a34a;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(34, 197, 94, 0.25);
      }
      .btn-danger {
        background: #ef4444;
        box-shadow: 0 2px 4px rgba(239, 68, 68, 0.15);
      }
      .btn-danger:hover {
        background: #dc2626;
        box-shadow: 0 4px 8px rgba(239, 68, 68, 0.25);
      }

      hr {
        border: none;
        border-top: 1px solid #f1f5f9;
        margin: 4px 0;
      }

      /* Panel Thống kê dạng Card sang trọng */
      .stats-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .stat-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
      }
      .stat-item span {
        color: #64748b;
      }
      .stat-item b {
        color: #0f172a;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div id="sidebar">
      <h2>🚚 Shipper Planner</h2>
      <p><i>Click lên bản đồ để chọn điểm giao hàng</i></p>

      <label><b>Chọn Giải thuật:</b></label>
      <select
        id="algoSelect"
        style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px"
      >
        <option value="brute_force">Vét cạn (Chính xác 100%)</option>
        <option value="greedy" selected>Tham ăn (Siêu nhanh)</option>
      </select>

      <!-- ===== PHẦN D: MÔ PHỎNG VẬT CẢN ===== -->
      <hr />

      <h3>🚧 Mô phỏng vật cản</h3>

      <label><b>Điểm bắt đầu:</b></label>
      <input
        type="number"
        id="obstacleFrom"
        min="1"
        placeholder="Ví dụ: 1"
        style="
          width: 100%;
          padding: 8px;
          margin-top: 5px;
          box-sizing: border-box;
        "
      />

      <label style="margin-top: 10px; display: block"
        ><b>Điểm kết thúc:</b></label
      >
      <input
        type="number"
        id="obstacleTo"
        min="1"
        placeholder="Ví dụ: 3"
        style="
          width: 100%;
          padding: 8px;
          margin-top: 5px;
          box-sizing: border-box;
        "
      />

      <label style="margin-top: 10px; display: block"
        ><b>Loại vật cản:</b></label
      >
      <select
        id="obstacleType"
        style="width: 100%; padding: 8px; margin-top: 5px"
      >
        <option value="blocked">🚫 Đường cấm</option>
        <option value="traffic">🚧 Đường kẹt</option>
      </select>

      <button class="btn" id="addObstacleBtn">Thêm Vật Cản</button>
      <button class="btn btn-danger" id="clearObstacleBtn">Xóa Vật Cản</button>

      <p>Vật cản hiện tại: <b id="obstacleCount">0</b></p>

      <button
        class="btn"
        id="runBtn"
        style="background: #007bff; margin-top: 15px"
      >
        🚀 Chạy Tìm Lộ Trình
      </button>
      <button class="btn btn-danger" id="clearBtn">🗑️ Xóa Tất Cả Điểm</button>

      <hr />
      <h3>📊 Thống kê số liệu:</h3>
      <p>Số điểm giao: <b id="pointCount">0</b></p>
      <p>Thời gian chạy: <b id="runTime">0 ms</b></p>
      <p>Tổng chi phí quãng đường: <b id="totalDist">0 km</b></p>
    </div>

    <!-- Màn hình bản đồ -->
    <div id="map"></div>

    <!-- Thư viện JS Bản đồ Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // 1. Khởi tạo bản đồ tại TP.HCM (Sử dụng OpenStreetMap Tile Layer)
      const map = L.map("map").setView([10.7769, 106.7009], 13);
      // CODE MỚI ĐÃ SỬA:
      // Thay thế đoạn L.tileLayer cũ bằng đoạn này:
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        {
          attribution:
            "Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012",
          maxZoom: 19,
        }
      ).addTo(map);

      setTimeout(() => {
        map.invalidateSize();
      }, 200);

      let points = [];
      let markers = [];
      let routeLayer = null;

      // ===== PHẦN MÔ PHỎNG VẬT CẢN =====
      const blockedEdges = new Set();
      const trafficEdges = new Map();
      let obstacleLayers = [];

      function edgeKey(a, b) {
        return a < b ? `${a}-${b}` : `${b}-${a}`;
      }

      function blockEdge(a, b) {
        blockedEdges.add(edgeKey(a, b));
      }

      function setTraffic(a, b, multiplier = 2) {
        trafficEdges.set(edgeKey(a, b), multiplier);
      }

      // 2. Sự kiện click chọn điểm trên bản đồ
      map.on("click", function (e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        points.push({ lat, lng });

        const marker = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`<b>Điểm ${points.length}</b> (Kho/Điểm giao)`)
          .openPopup();
        markers.push(marker);

        document.getElementById("pointCount").innerText = points.length;
      });

      // 3. Hàm tính khoảng cách công thức Haversine (km)
      function getDistance(p1, p2) {
        const R = 6371;
        const dLat = ((p2.lat - p1.lat) * Math.PI) / 180;
        const dLng = ((p2.lng - p1.lng) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((p1.lat * Math.PI) / 180) *
            Math.cos((p2.lat * Math.PI) / 180) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      }

      // Chi phí di chuyển có vật cản
      function getTravelCost(points, a, b) {
        const key = edgeKey(a, b);

        // Đường cấm
        if (blockedEdges.has(key)) {
          return Infinity;
        }

        // Khoảng cách thực tế
        let distance = getDistance(points[a], points[b]);

        // Nếu kẹt xe thì tăng chi phí (x2)
        const multiplier = trafficEdges.get(key) || 1;

        return distance * multiplier;
      }

      // Nút Thêm vật cản
      document
        .getElementById("addObstacleBtn")
        .addEventListener("click", () => {
          const a = parseInt(document.getElementById("obstacleFrom").value) - 1;
          const b = parseInt(document.getElementById("obstacleTo").value) - 1;
          const type = document.getElementById("obstacleType").value;

          if (
            isNaN(a) ||
            isNaN(b) ||
            a < 0 ||
            b < 0 ||
            a >= points.length ||
            b >= points.length
          ) {
            alert("Điểm nhập vào không hợp lệ!");
            return;
          }

          if (a === b) {
            alert("Hai điểm phải khác nhau!");
            return;
          }

          const key = edgeKey(a, b);
          let color;

          if (type === "blocked") {
            trafficEdges.delete(key);
            blockEdge(a, b);
            color = "red";
          } else {
            blockedEdges.delete(key);
            setTraffic(a, b, 2);
            color = "orange";
          }

          const obstacleLine = L.polyline(
            [
              [points[a].lat, points[a].lng],
              [points[b].lat, points[b].lng],
            ],
            {
              color: color,
              weight: 6,
              dashArray: "10, 10",
            }
          ).addTo(map);

          obstacleLayers.push(obstacleLine);

          document.getElementById("obstacleCount").innerText =
            blockedEdges.size + trafficEdges.size;
        });

      // Nút Xóa chỉ vật cản
      document
        .getElementById("clearObstacleBtn")
        .addEventListener("click", () => {
          blockedEdges.clear();
          trafficEdges.clear();

          obstacleLayers.forEach((layer) => map.removeLayer(layer));
          obstacleLayers = [];

          document.getElementById("obstacleCount").innerText = "0";
          document.getElementById("obstacleFrom").value = "";
          document.getElementById("obstacleTo").value = "";
        });

      // 4. THUẬT TOÁN BRUTE FORCE (ĐÃ FIX LOGIC FALLBACK)
      function solveBruteForce(points) {
        const n = points.length;
        if (n <= 1) return [0, 0];

        // Ma trận chi phí thực tế (tính cả kẹt/cấm)
        const dist = Array.from({ length: n }, () => new Float64Array(n));
        // Ma trận khoảng cách hình học thuần túy (dùng cho Fallback)
        const geomDist = Array.from({ length: n }, () => new Float64Array(n));

        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            if (i === j) {
              dist[i][j] = 0;
              geomDist[i][j] = 0;
            } else {
              dist[i][j] = getTravelCost(points, i, j);
              geomDist[i][j] = getDistance(points[i], points[j]);
            }
          }
        }

        let minDistance = Infinity;
        let bestPath = [];

        let fallbackDist = Infinity;
        let fallbackPath = [];

        const visited = new Uint8Array(n);
        const currentPath = [0];
        visited[0] = 1;

        // backtrack(thành phố hiện tại, số điểm đã đi, chi phí thực tế, chi phí hình học)
        function backtrack(currentCity, count, currentCost, geomCost) {
          if (count === n) {
            const returnCost = dist[currentCity][0];
            const geomReturnCost = geomDist[currentCity][0];

            // 1. Cập nhật đường dự phòng hình học (luôn tính dựa trên geomCost thuần túy)[cite: 1]
            const totalGeomCost = geomCost + geomReturnCost;
            if (totalGeomCost < fallbackDist) {
              fallbackDist = totalGeomCost;
              fallbackPath = [...currentPath, 0];
            }

            // 2. Cập nhật đường tối ưu chuẩn (chỉ nhận nếu đường về không bị cấm)[cite: 1]
            if (returnCost !== Infinity) {
              const totalCost = currentCost + returnCost;
              if (totalCost < minDistance) {
                minDistance = totalCost;
                bestPath = [...currentPath, 0];
              }
            }
            return;
          }

          for (let nextCity = 1; nextCity < n; nextCity++) {
            if (!visited[nextCity]) {
              const stepCost = dist[currentCity][nextCity];
              const stepGeomCost = geomDist[currentCity][nextCity];

              visited[nextCity] = 1;
              currentPath.push(nextCity);

              // Gọi đệ quy: Cập nhật song song cả Chi phí thực và Chi phí hình học
              backtrack(
                nextCity,
                count + 1,
                stepCost !== Infinity ? currentCost + stepCost : Infinity, // Nếu gặp cấm, currentCost gán luôn Infinity để triệt tiêu
                geomCost + stepGeomCost
              );

              currentPath.pop();
              visited[nextCity] = 0;
            }
          }
        }

        // Khởi chạy đệ quy[cite: 1]
        backtrack(0, 1, 0, 0);

        // Nếu không tìm thấy lộ trình hợp lệ nào (tất cả đều dính đường cấm)[cite: 1]
        if (bestPath.length === 0) {
          alert(
            "Cảnh báo: Tất cả lộ trình đều dính đường cấm! Thuật toán hiển thị lộ trình ngắn nhất về mặt khoảng cách hình học."
          );
          return fallbackPath;
        }

        return bestPath;
      }
      // THUẬT TOÁN GREEDY (An toàn chống kẹt)
      function solveGreedyQ(points) {
        if (!Array.isArray(points) || points.length === 0) return [];

        const n = points.length;
        const visited = new Array(n).fill(false);
        const route = [];

        let currentIndex = 0;
        visited[currentIndex] = true;
        route.push(currentIndex);

        while (route.length < n) {
          let nearestIndex = -1;
          let minCost = Infinity;

          for (let i = 0; i < n; i++) {
            if (visited[i]) continue;

            let cost = getTravelCost(points, currentIndex, i);
            if (cost < minCost) {
              minCost = cost;
              nearestIndex = i;
            }
          }

          // Nếu tất cả các điểm còn lại đều bị cấm, chọn điểm chưa thăm đầu tiên tìm thấy
          if (nearestIndex === -1) {
            for (let i = 0; i < n; i++) {
              if (!visited[i]) {
                nearestIndex = i;
                break;
              }
            }
          }

          visited[nearestIndex] = true;
          route.push(nearestIndex);
          currentIndex = nearestIndex;
        }

        route.push(0);
        return route;
      }

      // 5. HÀM VẼ ĐƯỜNG THEO LÀN ĐƯỜNG GIAO THÔNG THỰC TẾ (Sử dụng OSRM API)
      async function drawRoute(pathOrder) {
        if (routeLayer) map.removeLayer(routeLayer);
        if (!pathOrder || pathOrder.length === 0) return;

        let totalCost = 0;
        let fullRouteCoords = [];

        // Tạo danh sách tọa độ dạng: lng,lat;lng,lat... cho OSRM API
        const coordinatesString = pathOrder
          .map((idx) => `${points[idx].lng},${points[idx].lat}`)
          .join(";");

        // Gọi OSRM API công cộng để lấy tuyến đường giao thông thực tế
        const url = `https://router.project-osrm.org/route/v1/driving/${coordinatesString}?overview=full&geometries=geojson`;

        try {
          const response = await fetch(url);
          const data = await response.json();

          if (data.routes && data.routes.length > 0) {
            // Lấy danh sách tọa độ chi tiết bám theo lòng đường
            fullRouteCoords = data.routes[0].geometry.coordinates.map(
              (coord) => [coord[1], coord[0]]
            );

            // Tính tổng quãng đường thực tế theo kilomet
            totalCost = data.routes[0].distance / 1000;

            // Vẽ đường nối uốn lượn theo làn đường lên bản đồ
            routeLayer = L.polyline(fullRouteCoords, {
              color: "#007bff",
              weight: 5,
              opacity: 0.8,
            }).addTo(map);

            document.getElementById("totalDist").innerText =
              totalCost.toFixed(2) + " km (Đường thực tế)";
          }
        } catch (error) {
          console.error("Lỗi lấy đường đi từ OSRM:", error);
          alert(
            "Không thể kết nối API đường đi, vui lòng kiểm tra kết nối mạng!"
          );
        }

        // Cập nhật thứ tự di chuyển lên Popup của các Marker
        pathOrder.forEach((pointIndex, step) => {
          if (step < pathOrder.length - 1) {
            const isStart = step === 0 ? "<b>(Kho xuất phát)</b>" : "";
            markers[pointIndex].bindPopup(
              `<b>Điểm ${pointIndex + 1}</b> ${isStart}<br>Thứ tự đi: <b>Bước ${
                step + 1
              }</b>`
            );
          }
        });
      }
      // 6. Xử lý nút Chạy Tìm Lộ Trình
      document.getElementById("runBtn").addEventListener("click", () => {
        if (points.length < 2) {
          alert("Vui lòng chọn ít nhất 2 điểm trên bản đồ!");
          return;
        }

        const algo = document.getElementById("algoSelect").value;

        if (algo === "brute_force" && points.length > 10) {
          document.getElementById("runTime").innerText =
            "Không khả thi (N > 10)";
          alert(
            "Brute Force không khả thi với N > 10 vì số nhánh quay lui quá lớn!"
          );
          return;
        }

        let pathOrder = [];
        let totalTime = 0;

        let runs = algo === "greedy" ? 50 : points.length <= 8 ? 5 : 1;

        for (let i = 0; i < runs; i++) {
          const startTime = performance.now();

          if (algo === "brute_force") {
            pathOrder = solveBruteForce(points);
          } else if (algo === "greedy") {
            pathOrder = solveGreedyQ(points);
          }

          const endTime = performance.now();
          totalTime += endTime - startTime;
        }

        const averageTime = totalTime / runs;

        document.getElementById("runTime").innerText =
          averageTime.toFixed(4) + " ms (TB " + runs + " lần)";

        drawRoute(pathOrder);
      });

      // 7. Xử lý nút Xóa Tất Cả Điểm
      document.getElementById("clearBtn").addEventListener("click", () => {
        markers.forEach((m) => map.removeLayer(m));
        if (routeLayer) map.removeLayer(routeLayer);
        points = [];
        markers = [];
        routeLayer = null;

        blockedEdges.clear();
        trafficEdges.clear();

        obstacleLayers.forEach((layer) => map.removeLayer(layer));
        obstacleLayers = [];

        document.getElementById("obstacleCount").innerText = "0";
        document.getElementById("obstacleFrom").value = "";
        document.getElementById("obstacleTo").value = "";

        document.getElementById("pointCount").innerText = "0";
        document.getElementById("runTime").innerText = "0 ms";
        document.getElementById("totalDist").innerText = "0 km";
      });
    </script>
  </body>
</html>
