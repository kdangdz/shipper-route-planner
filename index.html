<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Shipper Route Planner - Visualizer</title>
    <!-- Thư viện CSS Bản đồ Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
      }
      #sidebar {
        width: 300px;
        padding: 20px;
        background: #f4f4f4;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        z-index: 1000;
      }
      #map {
        flex: 1;
        height: 100%;
        z-index: 1;
      }
      .btn {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-danger {
        background: #dc3545;
      }
      h2 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>🚚 Shipper Planner</h2>
      <p><i>Click lên bản đồ để chọn điểm giao hàng</i></p>

      <label><b>Chọn Giải thuật:</b></label>
      <select
        id="algoSelect"
        style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px"
      >
        <option value="brute_force">Vét cạn (Chính xác 100%)</option>
        <option value="greedy">Tham ăn (Siêu nhanh)</option>
      </select>

<!-- ===== PHẦN D: MÔ PHỎNG VẬT CẢN ===== -->
<hr />

<h3>🚧 Mô phỏng vật cản</h3>

<label><b>Điểm bắt đầu:</b></label>
<input
  type="number"
  id="obstacleFrom"
  min="1"
  placeholder="Ví dụ: 1"
  style="width: 100%; padding: 8px; margin-top: 5px"
/>

<label><b>Điểm kết thúc:</b></label>
<input
  type="number"
  id="obstacleTo"
  min="1"
  placeholder="Ví dụ: 3"
  style="width: 100%; padding: 8px; margin-top: 5px"
/>

<label><b>Loại vật cản:</b></label>
<select
  id="obstacleType"
  style="width: 100%; padding: 8px; margin-top: 5px"
>
  <option value="blocked">🚫 Đường cấm</option>
  <option value="traffic">🚧 Đường kẹt</option>
</select>

<button class="btn" id="addObstacleBtn">
  Thêm Vật Cản
</button>

<button class="btn btn-danger" id="clearObstacleBtn">
  Xóa Vật Cản
</button>

<p>Vật cản hiện tại: <b id="obstacleCount">0</b></p>

      <button class="btn" id="runBtn">🚀 Chạy Tìm Lộ Trình</button>
      <button class="btn btn-danger" id="clearBtn">🗑️ Xóa Tất Cả Điểm</button>

      <hr />
      <h3>📊 Thống kê số liệu:</h3>
      <p>Số điểm giao: <b id="pointCount">0</b></p>
      <p>Thời gian chạy: <b id="runTime">0 ms</b></p>
      <p>Tổng quãng đường: <b id="totalDist">0 km</b></p>
    </div>

    <!-- Màn hình bản đồ -->
    <div id="map"></div>

    <!-- Thư viện JS Bản đồ Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // 1. Khởi tạo bản đồ tại TP.HCM
      const map = L.map("map").setView([10.7769, 106.7009], 13);
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
        {
          attribution: "© OpenStreetMap, © CARTO",
          maxZoom: 19,
          subdomains: "abcd",
        }
      ).addTo(map);

      setTimeout(() => {
        map.invalidateSize();
      }, 200);

      let points = [];
      let markers = [];
      let routeLayer = null;

      // ===== PHẦN D: MÔ PHỎNG VẬT CẢN =====
const blockedEdges = new Set();
const trafficEdges = new Map();
let obstacleLayers = [];

function edgeKey(a, b) {
    return a < b ? `${a}-${b}` : `${b}-${a}`;
}

function blockEdge(a, b) {
    blockedEdges.add(edgeKey(a, b));
}

function isBlocked(a, b) {
    return blockedEdges.has(edgeKey(a, b));
}

function setTraffic(a, b, multiplier = 2) {
    trafficEdges.set(edgeKey(a, b), multiplier);
}

      // 2. Sự kiện click chọn điểm trên bản đồ
      map.on("click", function (e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        points.push({ lat, lng });

        const marker = L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`Điểm giao số ${points.length}`)
          .openPopup();
        markers.push(marker);

        document.getElementById("pointCount").innerText = points.length;
      });

      // 3. Hàm tính khoảng cách giữa 2 tọa độ (theo km)
      function getDistance(p1, p2) {
        const R = 6371;
        const dLat = ((p2.lat - p1.lat) * Math.PI) / 180;
        const dLng = ((p2.lng - p1.lng) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((p1.lat * Math.PI) / 180) *
            Math.cos((p2.lat * Math.PI) / 180) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      }

// ===== PHẦN D: CHI PHÍ DI CHUYỂN CÓ VẬT CẢN =====
function getTravelCost(points, a, b) {
    const key = edgeKey(a, b);

    // Đường cấm: không được đi
    if (blockedEdges.has(key)) {
        return Infinity;
    }

    // Khoảng cách thực tế
    let distance = getDistance(points[a], points[b]);

    // Nếu đường kẹt thì tăng chi phí
    const multiplier = trafficEdges.get(key) || 1;

    return distance * multiplier;
}

// ===== PHẦN D: XỬ LÝ NÚT THÊM VẬT CẢN =====
document.getElementById("addObstacleBtn").addEventListener("click", () => {
    // Người dùng nhập điểm từ 1, nhưng mảng JavaScript bắt đầu từ 0
    const a =
        parseInt(document.getElementById("obstacleFrom").value) - 1;

    const b =
        parseInt(document.getElementById("obstacleTo").value) - 1;

    const type =
        document.getElementById("obstacleType").value;

    // Kiểm tra điểm hợp lệ
    if (
        isNaN(a) ||
        isNaN(b) ||
        a < 0 ||
        b < 0 ||
        a >= points.length ||
        b >= points.length
    ) {
        alert("Điểm không hợp lệ!");
        return;
    }

    // Không cho chọn cùng một điểm
    if (a === b) {
        alert("Hai điểm phải khác nhau!");
        return;
    }

    const key = edgeKey(a, b);
    let color;

    if (type === "blocked") {
        // Nếu trước đó là đường kẹt thì xóa trạng thái kẹt
        trafficEdges.delete(key);

        blockEdge(a, b);
        color = "red";
    } else {
        // Nếu trước đó là đường cấm thì bỏ trạng thái cấm
        blockedEdges.delete(key);

        setTraffic(a, b, 2);
        color = "orange";
    }

    // Vẽ đường vật cản lên bản đồ
    const obstacleLine = L.polyline(
        [
            [points[a].lat, points[a].lng],
            [points[b].lat, points[b].lng]
        ],
        {
            color: color,
            weight: 5,
            dashArray: "10, 10"
        }
    ).addTo(map);

    obstacleLayers.push(obstacleLine);

    // Cập nhật số lượng vật cản
    document.getElementById("obstacleCount").innerText =
        blockedEdges.size + trafficEdges.size;
});

      // 4. KHUNG HÀM THUẬT TOÁN (TV2 & TV3 sẽ code phần ruột này)
      function solveBruteForce(points) {
        const n = points.length;
        if (n <= 1) return [0, 0];
        if (n === 2) return [0, 1, 0];

        // 1. Tiền xử lý: Xây dựng ma trận khoảng cách NxN
        const dist = Array.from({ length: n }, () => new Float64Array(n));
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            dist[i][j] = i === j ? 0 : getTravelCost(points, i, j);
          }
        }

        let minDistance = Infinity;
        let bestPath = [];
        const visited = new Uint8Array(n);
        const currentPath = [0];
        visited[0] = 1;

        // 2. Hàm đệ quy quay lui (Backtracking)
        function backtrack(currentCity, count, currentCost) {
          if (currentCost >= minDistance) {
            return;
          }

          if (count === n) {
            const totalCost = currentCost + dist[currentCity][0];
            if (totalCost < minDistance) {
              minDistance = totalCost;
              bestPath = [...currentPath, 0];
            }
            return;
          }

          for (let nextCity = 1; nextCity < n; nextCity++) {
            if (!visited[nextCity]) {
              visited[nextCity] = 1;
              currentPath.push(nextCity);

              backtrack(
                nextCity,
                count + 1,
                currentCost + dist[currentCity][nextCity]
              );

              currentPath.pop();
              visited[nextCity] = 0;
            }
          }
        }

        backtrack(0, 1, 0);
        return bestPath;
      }

      function solveGreedy(points) {
        let res = points.map((_, i) => i);
        res.push(0);
        return res;
      }

      // 5. Hàm vẽ đường nối các điểm dựa trên kết quả thuật toán
      function drawRoute(pathOrder) {
        if (routeLayer) map.removeLayer(routeLayer);

        let routeCoords = [];
        let totalKm = 0;

        for (let i = 0; i < pathOrder.length; i++) {
          let p = points[pathOrder[i]];
          routeCoords.push([p.lat, p.lng]);

          if (i > 0) {
            let prevP = points[pathOrder[i - 1]];
            totalKm += getDistance(prevP, p);
          }
        }

        routeLayer = L.polyline(routeCoords, { color: "red", weight: 4 }).addTo(
          map
        );
        document.getElementById("totalDist").innerText =
          totalKm.toFixed(2) + " km";
      }

      // 6. Xử lý nút bấm [Chạy Tìm Lộ Trình]
      document.getElementById("runBtn").addEventListener("click", () => {
        if (points.length < 2) {
          alert("Vui lòng click chọn ít nhất 2 điểm trên bản đồ!");
          return;
        }

        const algo = document.getElementById("algoSelect").value;

      // ===== PHẦN D: BENCHMARK THỜI GIAN =====

// Brute Force với N quá lớn có thể làm treo trình duyệt
if (algo === "brute_force" && points.length > 10) {
    document.getElementById("runTime").innerText =
        "Không khả thi với N > 10";

    alert(
        "Brute Force có độ phức tạp rất lớn. " +
        "Với N > 10, chương trình không chạy để tránh treo trình duyệt."
    );

    return;
}

let pathOrder = [];
let totalTime = 0;

// Greedy chạy 5 lần để lấy trung bình.
// Brute Force:
// N <= 8: chạy 5 lần
// N = 9 hoặc 10: chỉ chạy 1 lần vì rất nặng.
let runs;

if (algo === "greedy") {
    runs = 1000;
} else if (points.length <= 8) {
    runs = 5;
} else {
    runs = 1;
}

for (let i = 0; i < runs; i++) {
    const startTime = performance.now();

    if (algo === "brute_force") {
        pathOrder = solveBruteForce(points);
    } else if (algo === "greedy") {
        pathOrder = solveGreedy(points);
    }

    const endTime = performance.now();

    totalTime += endTime - startTime;
}

const averageTime = totalTime / runs;

document.getElementById("runTime").innerText =
    averageTime.toFixed(4) + " ms (TB " + runs + " lần)";

drawRoute(pathOrder);

 });
      // 7. Xử lý nút Xóa
      document.getElementById("clearBtn").addEventListener("click", () => {
        markers.forEach((m) => map.removeLayer(m));
        if (routeLayer) map.removeLayer(routeLayer);
        points = [];
        markers = [];
        routeLayer = null;

        // ===== PHẦN D: XÓA VẬT CẢN =====
    blockedEdges.clear();
    trafficEdges.clear();

    obstacleLayers.forEach((layer) => {
        map.removeLayer(layer);
    });

    obstacleLayers = [];

    document.getElementById("obstacleCount").innerText = "0";
    document.getElementById("obstacleFrom").value = "";
    document.getElementById("obstacleTo").value = "";

    document.getElementById("pointCount").innerText = 0;
    document.getElementById("runTime").innerText = "0 ms";
    document.getElementById("totalDist").innerText = "0 km";
});
    </script>
  <script src="thuat_toan_xap_xi.js"></script>
  </body>
</html>
